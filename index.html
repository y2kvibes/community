<script>
  // Данные и счётчики живут в Google Apps Script (тот же бэкенд, что и раньше).
  var API_URL = 'https://script.google.com/macros/s/AKfycbygaPMqN5QekLr8_pHlYPO_WL7wDhoTsuTDl4GFe04tJdivTSVspeacFPJSvsjBmhzeKg/exec';
  var REVIEWS = [];
  var FILTERED = REVIEWS;

  // POST c Content-Type: text/plain — «простой» запрос без preflight, который Apps Script принимает кросс-доменно.
  function apiCall(action, id, cid) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, id: id, cid: cid })
    }).then(function(r) { return r.json(); }).catch(function() { return { ok: false }; });
  }

  function clientId() {
    var k = 'y2kv_client_id';
    var id = localStorage.getItem(k);
    if (!id) {
      id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      localStorage.setItem(k, id);
    }
    return id;
  }

  function stars(n) {
    var full = '★★★★★'.slice(0, n);
    var empty = '☆☆☆☆☆'.slice(0, 5 - n);
    return full + empty;
  }

  function mediaHtml(r) {
    if (r.video) {
      var poster = r.videoPreview || (r.photos && r.photos[0]) || '';
      return '<a class="video-link" href="' + r.video + '" target="_blank" rel="noopener">' +
        (poster ? '<img loading="lazy" src="' + poster + '" alt="">' : '') +
        '<span class="play-badge">\u25B6</span></a>';
    }
    if (r.photos && r.photos.length) {
      return '<img loading="lazy" src="' + r.photos[0] + '" alt="">';
    }
    return '';
  }

  var canNativeHls = document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

  // Звук в автовоспроизведении, как в шортсах: SOUND_ON — желаемое состояние (запоминается).
  // Без жеста браузер звук блокирует — тогда tryPlay тихо падает на muted, а после первого
  // клика/свайпа следующие видео уже играют со звуком.
  var SOUND_ON = (function() { try { return localStorage.getItem('y2kv_sound') !== '0'; } catch (e) { return true; } })();
  var ICON_SND_ON = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
  var ICON_SND_OFF = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';

  // Иконка показывает ФАКТИЧЕСКОЕ состояние текущего видео (не желаемое): если звук
  // заблокирован политикой браузера, пользователь видит перечёркнутый динамик.
  function updateSoundBtns() {
    document.querySelectorAll('.mute-btn').forEach(function(b) {
      var v = b.parentNode ? b.parentNode.querySelector('video') : null;
      var on = v ? !v.muted : SOUND_ON;
      b.innerHTML = on ? ICON_SND_ON : ICON_SND_OFF;
    });
  }

  function overlayOpen() {
    return document.getElementById('overlay').classList.contains('open');
  }

  // Видео активного контекста: оверлей открыт — его видео, иначе видео карусели.
  function activeVideo() {
    return document.querySelector(overlayOpen() ? '#ovMedia video' : '#heroMedia video');
  }

  function toggleSound(e) {
    e.stopPropagation();
    var v = activeVideo();
    // Отталкиваемся от ФАКТИЧЕСКОГО состояния: если звук сейчас заблокирован политикой
    // (muted при SOUND_ON=true), первый же клик должен ВКЛЮЧИТЬ звук, а не «выключить» его.
    SOUND_ON = v ? v.muted : !SOUND_ON;
    try { localStorage.setItem('y2kv_sound', SOUND_ON ? '1' : '0'); } catch (err) {}
    if (v) {
      v.muted = !SOUND_ON;
      if (v.paused && !v._userPaused) v.play().catch(function() {});
    }
    updateSoundBtns();
  }

  var ICON_SHARE = '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M13 5.5l7 6.5-7 6.5v-3.9c-5.5 0-8.8 1.7-11 5.4.6-6.6 4.6-10.6 11-11.1V5.5z" fill="#fff"/></svg>';

  function showToast(msg) {
    var t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide = setTimeout(function() { t.classList.remove('show'); }, 1800);
  }

  // «Переслать»: системное меню шаринга на мобиле, на десктопе — копия ссылки в буфер.
  function sharePage(e) {
    e.stopPropagation();
    var url = 'https://y2kvibes.github.io/community/';
    if (navigator.share) { navigator.share({ title: document.title, url: url }).catch(function() {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() { showToast('Ссылка скопирована'); }, function() {});
    }
  }

  function makeShareBtn(box) {
    var b = document.createElement('button');
    b.className = 'share-btn';
    b.innerHTML = ICON_SHARE;
    b.addEventListener('click', sharePage);
    box.appendChild(b);
  }

  function makeMuteBtn(box, video) {
    var b = document.createElement('button');
    b.className = 'mute-btn';
    b.addEventListener('click', toggleSound);
    box.appendChild(b);
    video.addEventListener('volumechange', updateSoundBtns);
    updateSoundBtns();
  }

  // Автозапуск «как в шортсах»: пробуем со звуком (если SOUND_ON), при блокировке — muted.
  // Мутим ТОЛЬКО на NotAllowedError (политика браузера): AbortError от гонки загрузки HLS
  // не повод глушить звук — его добьют повторные попытки armAutoplay.
  function tryPlay(video) {
    if (video._userPaused) return;
    // Пока открыт оверлей, ничто вне его играть не должно: отложенные таймеры/события
    // hero-видео (armAutoplay, MANIFEST_PARSED) не имеют права возобновить его под оверлеем.
    if (overlayOpen() && !document.getElementById('ovMedia').contains(video)) return;
    video.muted = !SOUND_ON;
    var p = video.play();
    if (p && p.catch) p.catch(function(err) {
      if (!video.muted && err && err.name === 'NotAllowedError') {
        video.muted = true;
        updateSoundBtns();
        video.play().catch(function() {});
      }
    });
  }

  // Надёжный автозапуск: hls.js отдаёт данные в непредсказуемый момент, поэтому
  // несколько попыток — сразу, по событиям готовности и таймерами-страховками.
  function armAutoplay(video) {
    var again = function() { if (video.paused && !video._userPaused && document.body.contains(video)) tryPlay(video); };
    video.addEventListener('loadedmetadata', again);
    video.addEventListener('canplay', again);
    setTimeout(again, 350);
    setTimeout(again, 1200);
    tryPlay(video);
  }

  // Клик по превью: если hls.js загрузился (или Safari умеет HLS сам) — играем прямо в карточке,
  // иначе фолбэк: ссылка откроется в новой вкладке как раньше.
  function playInline(link) {
    var src = link.getAttribute('href');
    var hlsOk = (typeof Hls !== 'undefined') && Hls.isSupported();
    if (!hlsOk && !canNativeHls) return false;
    var video = document.createElement('video');
    video.controls = true;
    video.setAttribute('playsinline', '');
    var img = link.querySelector('img');
    if (img) video.poster = img.src;
    link.parentNode.replaceChild(video, link);
    document.querySelectorAll('.media video').forEach(function(v2) { if (v2 !== video) v2.pause(); });
    // И карусель тоже: два звучащих видео одновременно недопустимы.
    var hv = document.querySelector('#heroMedia video');
    if (hv) hv.pause();
    if (hlsOk) {
      var hls = new Hls();
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play().catch(function() {}); });
    } else {
      video.src = src;
      video.play();
    }
    return true;
  }

  function initVideos() {
    document.querySelectorAll('a.video-link').forEach(function(link) {
      link.addEventListener('click', function(e) {
        if (playInline(link)) e.preventDefault();
      });
    });
  }

  // Герой-карусель: рандомное видео автозапускается (muted — политика браузеров),
  // стрелки листают перемешанные фото/видео, «Смотреть все» скроллит к сетке.
  var HERO = [];
  var heroIdx = 0;
  var heroHls = null;
  var heroStarted = false;

  function shuffleArr(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Сначала все видео (перемешанные), потом фото — сетка ниже остаётся по дате.
  function buildHero() {
    var vids = shuffleArr(FILTERED.filter(function(r) { return r.video; }));
    var phs = shuffleArr(FILTERED.filter(function(r) { return !r.video; }));
    HERO = vids.concat(phs);
  }

  // Крупный ▶ по центру — ТОЛЬКО когда видео остановил сам пользователь.
  // При заминках автозапуска/буферизации бейдж не показываем.
  function attachPauseBadge(container, video) {
    var badge = document.createElement('div');
    badge.className = 'pause-badge';
    badge.textContent = '▶';
    container.appendChild(badge);
    function upd() { badge.style.display = (video.paused && video._userPaused) ? 'flex' : 'none'; }
    video.addEventListener('pause', upd);
    video.addEventListener('play', upd);
    video.addEventListener('playing', upd);
    upd();
  }

  function renderHero(autoplay) {
    var box = document.getElementById('heroMedia');
    if (!HERO.length || !box) return;
    if (heroHls) { try { heroHls.destroy(); } catch (e) {} heroHls = null; }
    var r = HERO[heroIdx];
    box.innerHTML = '';
    if (r.video) {
      var video = document.createElement('video');
      video.muted = true;
      video.loop = true;
      video.setAttribute('playsinline', '');
      var poster = r.videoPreview || (r.photos && r.photos[0]) || '';
      if (poster) video.poster = poster;
      box.appendChild(video);
      attachPauseBadge(box, video);
      makeMuteBtn(box, video);
      var hlsOk = (typeof Hls !== 'undefined') && Hls.isSupported();
      if (hlsOk) {
        heroHls = new Hls();
        heroHls.loadSource(r.video);
        heroHls.attachMedia(video);
        if (autoplay) {
          heroHls.on(Hls.Events.MANIFEST_PARSED, function() { tryPlay(video); });
          armAutoplay(video);
        }
      } else if (canNativeHls) {
        video.src = r.video;
        if (autoplay) armAutoplay(video);
      }
    } else if (r.photos && r.photos.length) {
      var img = document.createElement('img');
      img.src = r.photos[0];
      img.alt = '';
      box.appendChild(img);
    }
    var cap = document.createElement('div');
    cap.className = 'hero-caption';
    cap.textContent = (r.userName || 'Покупатель') + (r.articul ? ' · ' + r.articul : '');
    box.appendChild(cap);
    var exp = document.createElement('button');
    exp.className = 'expand-btn';
    exp.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 6V2h4M14 10v4h-4M10 2h4v4M6 14H2v-4" stroke="white" stroke-width="1.6" fill="none"/></svg>';
    exp.addEventListener('click', function(e) {
      e.stopPropagation();
      openOverlay(heroIdx);
    });
    box.appendChild(exp);
    var lk = document.createElement('button');
    lk.className = 'hero-like';
    var likedKey = 'y2kv_liked_' + r.feedbackId;
    function likeHtml() {
      return '<span class="hrt">' + (localStorage.getItem(likedKey) === '1' ? '❤️' : '🤍') + '</span><span class="cnt">' + (r.likes || 0) + '</span>';
    }
    lk.innerHTML = likeHtml();
    lk.addEventListener('click', function(e) {
      e.stopPropagation();
      if (localStorage.getItem(likedKey) === '1') return;
      localStorage.setItem(likedKey, '1');
      r.likes = (r.likes || 0) + 1;
      lk.innerHTML = likeHtml();
      apiCall('like', r.feedbackId, clientId()).then(function(res) { if (res && res.ok && typeof res.likes === 'number') { r.likes = res.likes; lk.querySelector('.cnt').textContent = res.likes; } });
    });
    box.appendChild(lk);
    makeShareBtn(box);
  }

  // Шортс-режим: тап по карусели раскрывает видео на весь экран со звуком,
  // свайп вверх/вниз (или стрелки) листает следующие.
  var ovIdx = 0;
  var ovHls = null;

  function renderOverlay() {
    var box = document.getElementById('ovMedia');
    if (ovHls) { try { ovHls.destroy(); } catch (e) {} ovHls = null; }
    var r = HERO[ovIdx];
    box.innerHTML = '';
    if (r.video) {
      var video = document.createElement('video');
      video.loop = true;
      video.setAttribute('playsinline', '');
      var poster = r.videoPreview || (r.photos && r.photos[0]) || '';
      if (poster) video.poster = poster;
      box.appendChild(video);
      attachPauseBadge(box, video);
      makeMuteBtn(box, video);
      var hlsOk = (typeof Hls !== 'undefined') && Hls.isSupported();
      if (hlsOk) {
        ovHls = new Hls();
        ovHls.loadSource(r.video);
        ovHls.attachMedia(video);
        ovHls.on(Hls.Events.MANIFEST_PARSED, function() { tryPlay(video); });
        armAutoplay(video);
      } else if (canNativeHls) {
        video.src = r.video;
        armAutoplay(video);
      }
      video.addEventListener('click', function() {
        if (video.paused) { video._userPaused = false; video.play().catch(function() {}); }
        else { video._userPaused = true; video.pause(); }
      });
    } else if (r.photos && r.photos.length) {
      var img = document.createElement('img');
      img.src = r.photos[0];
      box.appendChild(img);
    }
    var info = document.createElement('div');
    info.className = 'overlay-info';
    var infoHtml = '<div class="oi-stars">' + stars(r.rating) + '</div>';
    if (r.text) infoHtml += '<div class="oi-text">' + escapeHtml(r.text) + '</div>';
    infoHtml += '<div class="oi-name">' + escapeHtml(r.userName || 'Покупатель') + (r.articul ? ' · ' + escapeHtml(r.articul) : '') + '</div>';
    info.innerHTML = infoHtml;
    box.appendChild(info);
    var likeBtn = document.createElement('button');
    likeBtn.className = 'ov-like';
    var likedKey = 'y2kv_liked_' + r.feedbackId;
    var liked = localStorage.getItem(likedKey) === '1';
    likeBtn.innerHTML = '<span>' + (liked ? '❤️' : '🤍') + '</span><span class="cnt">' + (r.likes || 0) + '</span>';
    likeBtn.addEventListener('click', function() {
      if (localStorage.getItem(likedKey) === '1') return;
      localStorage.setItem(likedKey, '1');
      r.likes = (r.likes || 0) + 1;
      likeBtn.innerHTML = '<span>❤️</span><span class="cnt">' + r.likes + '</span>';
      apiCall('like', r.feedbackId, clientId()).then(function(res) { if (res && res.ok && typeof res.likes === 'number') { r.likes = res.likes; likeBtn.querySelector('.cnt').textContent = res.likes; } });
    });
    box.appendChild(likeBtn);
    makeShareBtn(box);
  }

  function openOverlay(idx) {
    ovIdx = idx;
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    var hv = document.querySelector('.hero-media video');
    if (hv) hv.pause();
    renderOverlay();
  }

  function closeOverlay() {
    if (ovHls) { try { ovHls.destroy(); } catch (e) {} ovHls = null; }
    document.getElementById('ovMedia').innerHTML = '';
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
    // Пауза hero была «от оверлея», не ручная — автовоспроизведение продолжается.
    var hv = document.querySelector('#heroMedia video');
    if (hv) tryPlay(hv);
  }

  function ovShift(d) {
    ovIdx = (ovIdx + d + HERO.length) % HERO.length;
    renderOverlay();
  }

  function heroShift(d) {
    if (!HERO.length) return;
    heroIdx = (heroIdx + d + HERO.length) % HERO.length;
    renderHero(true);
  }

  function initHero() {
    if (!REVIEWS.length) { document.getElementById('hero').style.display = 'none'; return; }
    buildHero();
    renderHero(false);
    document.getElementById('heroPrev').addEventListener('click', function() { heroShift(-1); });
    document.getElementById('heroNext').addEventListener('click', function() { heroShift(1); });
    document.getElementById('seeAll').addEventListener('click', function() {
      document.getElementById('grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.getElementById('heroMedia').addEventListener('click', function() { openOverlay(heroIdx); });
    document.getElementById('ovClose').addEventListener('click', closeOverlay);
    document.getElementById('ovPrev').addEventListener('click', function() { ovShift(-1); });
    document.getElementById('ovNext').addEventListener('click', function() { ovShift(1); });
    document.addEventListener('keydown', function(e) {
      if (!document.getElementById('overlay').classList.contains('open')) return;
      if (e.key === 'Escape') closeOverlay();
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') ovShift(1);
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ovShift(-1);
    });
    var ovTX = null, ovTY = null;
    var ov = document.getElementById('overlay');
    ov.addEventListener('touchstart', function(e) { ovTX = e.touches[0].clientX; ovTY = e.touches[0].clientY; }, { passive: true });
    ov.addEventListener('touchend', function(e) {
      if (ovTX === null) return;
      var dx = e.changedTouches[0].clientX - ovTX;
      var dy = e.changedTouches[0].clientY - ovTY;
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 50) ovShift(dy < 0 ? 1 : -1);
      else if (Math.abs(dx) > 50) ovShift(dx < 0 ? 1 : -1);
      ovTX = null; ovTY = null;
    }, { passive: true });
    var touchX = null;
    var band = document.getElementById('hero');
    band.addEventListener('touchstart', function(e) { touchX = e.touches[0].clientX; }, { passive: true });
    band.addEventListener('touchend', function(e) {
      if (touchX === null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) heroShift(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });
    if ('IntersectionObserver' in window) {
      // Постоянный наблюдатель: старт при первом появлении, дальше — пауза за экраном
      // (unmuted-видео не должно звучать из-за пределов вьюпорта) и возобновление при возврате.
      var io = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          var hv = document.querySelector('#heroMedia video');
          if (entry.isIntersecting) {
            if (!heroStarted) { heroStarted = true; renderHero(true); return; }
            if (hv && hv.paused && !hv._userPaused && !overlayOpen()) {
              document.querySelectorAll('.media video').forEach(function(v2) { v2.pause(); });
              tryPlay(hv);
            }
          } else if (hv && !hv.paused && !overlayOpen()) {
            hv.pause();
          }
        });
      }, { threshold: 0.4 });
      io.observe(document.getElementById('heroMedia'));
    } else {
      renderHero(true);
    }
  }

  var GRID_BATCH = 24;
  var gridPos = 0;
  var viewIo = null;
  var cidGlobal = null;

  function cardHtml(r) {
    var liked = localStorage.getItem('y2kv_liked_' + r.feedbackId) === '1';
      return (
        '<div class="card" data-id="' + r.feedbackId + '">' +
          '<div class="media">' + mediaHtml(r) + '<span class="stars">' + stars(r.rating) + '</span></div>' +
          '<div class="body">' +
            '<p class="text">' + escapeHtml(r.text || [r.pros, r.cons].filter(Boolean).join(' ')) + '</p>' +
            '<div class="meta">' + escapeHtml(r.userName || 'Покупатель') + (r.articul ? ' · ' + escapeHtml(r.articul) : '') + '</div>' +
            '<div class="footer-row">' +
              '<button class="like-btn' + (liked ? ' liked' : '') + '" data-id="' + r.feedbackId + '">' +
                '<span class="heart">' + (liked ? '❤️' : '🤍') + '</span><span class="like-count">' + (r.likes || 0) + '</span>' +
              '</button>' +
              '<span class="views"><span>👁</span><span class="view-count">' + (r.views || 0) + '</span></span>' +
            '</div>' +
          '</div>' +
        '</div>'
    );
  }

  function bindCard(card, cid) {
    var btn = card.querySelector('.like-btn');
    btn.addEventListener('click', function() {
      var id = btn.getAttribute('data-id');
      var likedKey = 'y2kv_liked_' + id;
      if (localStorage.getItem(likedKey) === '1') return;
      localStorage.setItem(likedKey, '1');
      btn.classList.add('liked');
      btn.querySelector('.heart').textContent = '❤️';
      var count = btn.querySelector('.like-count');
      count.textContent = (parseInt(count.textContent, 10) || 0) + 1;
      apiCall('like', id, cid).then(function(res) { if (res && res.ok && typeof res.likes === 'number') count.textContent = res.likes; });
    });
    if (viewIo) viewIo.observe(card);
    var link = card.querySelector('a.video-link');
    if (link) link.addEventListener('click', function(e) { if (playInline(link)) e.preventDefault(); });
  }

  // Лента рендерится порциями — страница открывается быстро даже при 1000+ отзывах.
  function appendChunk() {
    if (gridPos >= FILTERED.length) return;
    var grid = document.getElementById('grid');
    var end = Math.min(gridPos + GRID_BATCH, FILTERED.length);
    var html = '';
    for (var i = gridPos; i < end; i++) html += cardHtml(FILTERED[i]);
    var before = grid.children.length;
    grid.insertAdjacentHTML('beforeend', html);
    for (var k = before; k < grid.children.length; k++) bindCard(grid.children[k], cidGlobal);
    gridPos = end;
  }

  // Полоса товаров: мини-карточки с ГЛАВНЫМ фото карточки WB (по nmId через публичный CDN,
  // при ошибке загрузки — фолбэк на фото из отзыва), клик — фильтр по артикулу.
  var ART_FILTER = null;

  var WB_HOST_CACHE = {}; // vol -> хост, реально отдавший фото (на сессию; полоса пересобирается при фильтрах)

  function wbHostTable_(vol) {
    var h;
    if (vol <= 143) h = '01';
    else if (vol <= 287) h = '02';
    else if (vol <= 431) h = '03';
    else if (vol <= 719) h = '04';
    else if (vol <= 1007) h = '05';
    else if (vol <= 1061) h = '06';
    else if (vol <= 1115) h = '07';
    else if (vol <= 1169) h = '08';
    else if (vol <= 1313) h = '09';
    else if (vol <= 1601) h = '10';
    else if (vol <= 1655) h = '11';
    else if (vol <= 1919) h = '12';
    else if (vol <= 2045) h = '13';
    else if (vol <= 2189) h = '14';
    else if (vol <= 2405) h = '15';
    else if (vol <= 2621) h = '16';
    else if (vol <= 2837) h = '17';
    else if (vol <= 3053) h = '18';
    else if (vol <= 3269) h = '19';
    else if (vol <= 3485) h = '20';
    else if (vol <= 3701) h = '21';
    else if (vol <= 3917) h = '22';
    else if (vol <= 4133) h = '23';
    else if (vol <= 4349) h = '24';
    else if (vol <= 4565) h = '25';
    else {
      var n = 26 + Math.floor((vol - 4566) / 312);
      h = (n < 10 ? '0' : '') + n;
    }
    return h;
  }

  // Список URL-кандидатов фото карточки: диапазоны новых бакетов WB шире 312 vol и растут,
  // поэтому расчёт даёт ВЕРХНЮЮ оценку — реальный хост на 0-5 ниже (проверено на живых nmId).
  // Перебираем вниз через onerror, найденный хост кэшируем по vol.
  function wbImgCandidates(nm) {
    var vol = Math.floor(nm / 100000);
    var part = Math.floor(nm / 1000);
    var hosts = [];
    if (WB_HOST_CACHE[vol]) hosts.push(WB_HOST_CACHE[vol]);
    var base = wbHostTable_(vol);
    hosts.push(base);
    if (vol > 4565) {
      var n = Number(base);
      for (var d = 1; d <= 5; d++) if (n - d >= 26) hosts.push((n - d < 10 ? '0' : '') + (n - d));
      hosts.push((n + 1 < 10 ? '0' : '') + (n + 1));
    }
    var seen = {}, out = [];
    hosts.forEach(function(h) { if (!seen[h]) { seen[h] = true; out.push(h); } });
    return out.map(function(h) {
      return 'https://basket-' + h + '.wbbasket.ru/vol' + vol + '/part' + part + '/' + nm + '/images/c246x328/1.webp';
    });
  }

  function buildProdStrip() {
    var byArt = {};
    REVIEWS.forEach(function(r) {
      if (!r.articul) return;
      if (!byArt[r.articul]) byArt[r.articul] = { art: r.articul, count: 0, img: '', nm: 0 };
      byArt[r.articul].count++;
      if (!byArt[r.articul].img) byArt[r.articul].img = (r.photos && r.photos[0]) || r.videoPreview || '';
      if (!byArt[r.articul].nm && r.nmId) byArt[r.articul].nm = r.nmId;
    });
    var arts = Object.keys(byArt).map(function(k) { return byArt[k]; })
      .filter(function(a) { return a.img; })
      .sort(function(a, b) { return b.count - a.count; })
      .slice(0, 40);
    var strip = document.getElementById('prodStrip');
    strip.innerHTML = arts.map(function(a) {
      var src = a.nm ? wbImgCandidates(a.nm)[0] : a.img;
      return '<div class="prod-chip" data-art="' + a.art + '"><img loading="lazy" src="' + src + '" data-nm="' + (a.nm || '') + '" data-hidx="0" data-fb="' + a.img + '" alt=""><div class="cap">' + a.art + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(strip.querySelectorAll('img'), function(im) {
      im.addEventListener('error', function() {
        var nm = Number(im.getAttribute('data-nm') || 0);
        if (nm) {
          var idx = Number(im.getAttribute('data-hidx') || 0) + 1;
          var cands = wbImgCandidates(nm);
          if (idx < cands.length) {
            im.setAttribute('data-hidx', String(idx));
            im.src = cands[idx];
            return;
          }
        }
        var fb = im.getAttribute('data-fb');
        if (fb && im.src !== fb) im.src = fb;
      });
      im.addEventListener('load', function() {
        var nm = Number(im.getAttribute('data-nm') || 0);
        if (!nm) return;
        var m = im.src.match(/basket-(\d+)\.wbbasket/);
        if (m) WB_HOST_CACHE[Math.floor(nm / 100000)] = m[1];
      });
    });
    strip.addEventListener('click', function(e) {
      var chip = e.target.closest('.prod-chip');
      if (!chip) return;
      var art = chip.getAttribute('data-art');
      setArtFilter(ART_FILTER === art ? null : art);
    });
  }

  function setArtFilter(art) {
    ART_FILTER = art;
    document.querySelectorAll('.prod-chip').forEach(function(c) {
      c.classList.toggle('active', c.getAttribute('data-art') === art);
    });
    FILTERED = art ? REVIEWS.filter(function(r) { return r.articul === art; }) : REVIEWS;
    document.getElementById('grid').innerHTML = '';
    gridPos = 0;
    appendChunk();
    buildHero();
    heroIdx = 0;
    renderHero(true);
  }

  function render() {
    if (!REVIEWS.length) {
      document.getElementById('empty').style.display = 'block';
      return;
    }
    cidGlobal = clientId();
    if ('IntersectionObserver' in window) {
      var seen = {};
      viewIo = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (!entry.isIntersecting) return;
          var card = entry.target;
          var id = card.getAttribute('data-id');
          var viewedKey = 'y2kv_viewed_' + id;
          if (seen[id] || localStorage.getItem(viewedKey) === '1') return;
          seen[id] = true;
          localStorage.setItem(viewedKey, '1');
          viewIo.unobserve(card);
          var countEl = card.querySelector('.view-count');
          apiCall('view', id, cidGlobal).then(function(res) { if (res && res.ok && countEl) countEl.textContent = res.views; });
        });
      }, { threshold: 0.5 });
      var sIo = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) { if (entry.isIntersecting) appendChunk(); });
      }, { rootMargin: '600px' });
      sIo.observe(document.getElementById('gridSentinel'));
      appendChunk();
    } else {
      while (gridPos < FILTERED.length) appendChunk();
    }
    buildProdStrip();
    initHero();
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function attachHandlers(cid) {
    document.querySelectorAll('.like-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = btn.getAttribute('data-id');
        var likedKey = 'y2kv_liked_' + id;
        if (localStorage.getItem(likedKey) === '1') return;
        localStorage.setItem(likedKey, '1');
        btn.classList.add('liked');
        var heart = btn.querySelector('.heart');
        var count = btn.querySelector('.like-count');
        heart.textContent = '❤️';
        count.textContent = (parseInt(count.textContent, 10) || 0) + 1;
        apiCall('like', id, cid).then(function(res) { if (res && res.ok && typeof res.likes === 'number') count.textContent = res.likes; });
      });
    });
  }

  function observeViews(cid) {
    if (!('IntersectionObserver' in window)) return;
    var seen = {};
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (!entry.isIntersecting) return;
        var card = entry.target;
        var id = card.getAttribute('data-id');
        var viewedKey = 'y2kv_viewed_' + id;
        if (seen[id] || localStorage.getItem(viewedKey) === '1') return;
        seen[id] = true;
        localStorage.setItem(viewedKey, '1');
        io.unobserve(card);
        var countEl = card.querySelector('.view-count');
        apiCall('view', id, cid).then(function(res) { if (res && res.ok && countEl) countEl.textContent = res.views; });
      });
    }, { threshold: 0.5 });
    document.querySelectorAll('.card').forEach(function(card) { io.observe(card); });
  }

  fetch(API_URL + '?json=1')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      REVIEWS = data;
      FILTERED = REVIEWS;
      render();
      // Диплинк с карточки товара: ?art=ipant0016 сразу фильтрует отзывы по этому артикулу.
      try {
        var art = new URLSearchParams(location.search).get('art');
        if (art && REVIEWS.some(function(r) { return r.articul === art; })) setArtFilter(art);
      } catch (e) {}
    })
    .catch(function() {
      var el = document.getElementById('empty');
      el.style.display = 'block';
      el.textContent = 'Не удалось загрузить отзывы — обновите страницу';
    });
</script>
</body>
</html>
