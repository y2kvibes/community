<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Подарок с фестиваля · Y2K VIBES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --green:#B4E600; --bg:#0A0A0A; --card:#161616; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:#fff;
    font-family:'Onest',system-ui,-apple-system,sans-serif;
    overflow-x:hidden;
  }
  .wrap{
    min-height:100svh; max-width:480px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 10px);
    animation:fadeUp .45s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .grow{flex:1}
  h2{
    font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
    color:var(--green); font-size:clamp(26px,7.5vw,36px); line-height:1.1;
  }
  .sub{font-size:16px; font-weight:500; color:#c9c9c9; margin-top:6px}
  .muted{font-size:14px; color:#9a9a9a; margin-top:6px; line-height:1.45}
  .emoji{font-size:44px; line-height:1; margin-bottom:10px}
  .big-sum{
    font-family:'Oswald',sans-serif; font-weight:700; color:var(--green);
    font-size:clamp(44px,14vw,64px); line-height:1; margin-top:8px;
    text-shadow:0 0 40px rgba(180,230,0,.45);
  }
  .promo-box{
    margin-top:16px; width:100%;
    border:2px dashed var(--green); border-radius:18px; background:var(--card);
    padding:12px 18px;
  }
  .promo-label{font-size:13px; color:#9a9a9a; text-transform:uppercase; letter-spacing:.14em}
  .promo-code{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:clamp(30px,9.5vw,40px); color:#fff;
    letter-spacing:.14em; margin-top:4px; text-indent:.14em;
  }
  .btn{
    display:block; width:100%; border:none; cursor:pointer; text-decoration:none;
    background:var(--green); color:#0A0A0A;
    font-family:'Onest',sans-serif; font-weight:600; font-size:18px;
    padding:14px 20px; border-radius:16px; margin-top:10px;
    box-shadow:0 0 26px rgba(180,230,0,.35);
    transition:transform .12s;
  }
  .btn:active{transform:scale(.97)}
  .btn2{
    background:var(--card); color:var(--green);
    border:1.5px solid var(--green); box-shadow:none; margin-top:10px;
  }
  .hint{
    font-size:15px; font-weight:500; color:#c9c9c9; margin-top:12px;
  }
  .toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(24px);
    background:var(--green); color:#0A0A0A; font-weight:600; font-size:15px;
    padding:12px 22px; border-radius:100px; opacity:0; pointer-events:none;
    transition:all .3s; z-index:50; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .foot{margin-top:8px; font-size:12px; color:#565656}
  .foot a{color:#565656}
</style>
</head>
<body>
<div class="wrap">
  <div class="grow"></div>
  <div class="emoji">🎉</div>
  <h2>Подарок активирован</h2>
  <div class="big-sum">+500&nbsp;₽</div>
  <div class="sub">на покупку в Y2K VIBES</div>
  <div class="muted">Спасибо, что были на фестивале 💜</div>

  <div class="promo-box">
    <div class="promo-label">Промокод</div>
    <div class="promo-code">GLOW500</div>
  </div>

  <button class="btn" onclick="copyPromo()">📋 Скопировать</button>

  <div class="hint">👇 Популярные модели среди танцоров</div>
  <a class="btn btn2" href="https://y2kvibes.ru/catalog/bryki" target="_blank" rel="noopener" onclick="track('fpants')">Выбрать штаны →</a>

  <div class="grow"></div>
  <div class="foot"><a href="https://y2kvibes.ru/" target="_blank" rel="noopener">y2kvibes.ru</a></div>
</div>

<div class="toast" id="toast">Промокод GLOW500 скопирован ✓</div>

<script>
  /* Счётчик: те же события в лист OrderStats (Apps Script «Видеоотзывы WB»),
     id с префиксом f*, чтобы отличать фестиваль от вкладыша. На localhost не шлём. */
  var API = 'https://script.google.com/macros/s/AKfycbygaPMqN5QekLr8_pHlYPO_WL7wDhoTsuTDl4GFe04tJdivTSVspeacFPJSvsjBmhzeKg/exec';
  var cid = '';
  try {
    cid = localStorage.getItem('y2kv_fest_cid');
    if (!cid) {
      cid = 'f' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('y2kv_fest_cid', cid);
    }
  } catch (e) { cid = 'nocookie'; }
  function track(ev){
    if (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') return;
    var payload = JSON.stringify({ action: 'order', id: ev, cid: cid });
    try {
      if (!(navigator.sendBeacon && navigator.sendBeacon(API, payload))) {
        fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: payload, keepalive: true });
      }
    } catch (e) {}
  }
  track('fvisit');
  function copyPromo(){
    track('fcopy');
    var done = function(){
      var t = document.getElementById('toast');
      t.classList.add('show');
      clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText('GLOW500').then(done).catch(function(){ fallback(); done(); });
    } else { fallback(); done(); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = 'GLOW500'; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
    }
  }
</script>
</body>
</html>
